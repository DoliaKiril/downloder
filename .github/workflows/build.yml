name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Фиксируем стабильную версию Linux во избежание сбоев при обновлениях серверов GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Берет актуальную стабильную версию Flutter, чтобы избежать конфликтов с Flet

      - name: Install Dependencies
        run: pip install flet requests

      - name: Build APK
        run: flet build apk --project-name kemono_dl --project-version "1.0.0"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # Использование v4 обязательно, v3 ломается на новых серверах
        with:
          name: KemonoDownloader
          path: build/apk/**/*.apk
